version: "3"

includes:
  scaling-queue-postgres:
    taskfile: ./scaling-queue-postgres
    dir: .

tasks:
  build:
    desc: Build every Bazel target.
    cmds:
      - bazel build //...

  test:
    desc: Run every unit test.
    cmds:
      - bazel test //...

  check:
    desc: Build, check formatting, and check the documents. Run before declaring work done.
    cmds:
      - bazel build //...
      - bazel run //:format.check
      - task: scaling-queue-postgres:docs:check
